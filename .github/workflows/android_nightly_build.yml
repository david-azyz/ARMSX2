name: Android Nightly Debug Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'

  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      package_name: ${{ steps.package_info.outputs.PACKAGE_NAME }}
      version_name: ${{ steps.package_info.outputs.VERSION_NAME }}
      release_tag: ${{ steps.release_vars.outputs.RELEASE_TAG }}
      release_title: ${{ steps.release_vars.outputs.RELEASE_TITLE }}

    steps:
      - name: Checkout of code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Java and Android SDK Setup
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # --- Build Phase ---
      - name: Running the Debug Build (only Nightly)
        run: ./gradlew assembleUnrestrictedDebug

      - name: Get Package Name and Version
        id: package_info
        run: |
          PACKAGE_NAME=$(grep 'applicationId' app/build.gradle | head -n 1 | awk '{print $2}' | tr -d '"')
          VERSION_NAME=$(grep 'versionName' app/build.gradle | head -n 1 | awk '{print $2}' | tr -d '"')
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Defining the Release Tag and Title
        id: release_vars
        run: |
          # The release tag will be in the format: come.nanodata.armsx2-nightly-1.0.4-20251104-1411
          DATE_TIME=$(date +%Y%m%d-%H%M)
          FULL_TAG="${{ steps.package_info.outputs.PACKAGE_NAME }}-v${{ steps.package_info.outputs.VERSION_NAME }}-${DATE_TIME}"
          TITLE="BombaPatch Controle Davizz - v${{ steps.package_info.outputs.VERSION_NAME }} (${DATE_TIME})"
          
          echo "RELEASE_TAG=$FULL_TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_TITLE=$TITLE" >> $GITHUB_OUTPUT

      - name: Find and Rename APK to Nightly
        id: rename_apk
        run: |
          ORIGINAL_PATH=$(find ${{ github.workspace }}/app/build -type f -name "*debug.apk" -print -quit)
          if [ -z "$ORIGINAL_PATH" ]; then
            echo "CRITICAL ERROR: Debug APK non found."
            exit 1 
          fi
          NEW_FILE_PATH="$(dirname "$ORIGINAL_PATH")/BombaPath_Controle_Davizz.apk"
          mv "$ORIGINAL_PATH" "$NEW_FILE_PATH"
          echo "APK_FILE_NIGHTLY=$NEW_FILE_PATH" >> $GITHUB_OUTPUT
          echo "APK renamed and saved in: $NEW_FILE_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package_info.outputs.PACKAGE_NAME }}
          path: ${{ steps.rename_apk.outputs.APK_FILE_NIGHTLY }}

  release:
    permissions:
      contents: write

    needs: [ build ]

    if: >
      github.repository == 'david-azyz/ARMSX2' &&
      github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.package_name }}
          path: artifact

      - name: Create the Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: ${{ needs.build.outputs.release_title }}
          body: |
            ## BombaPatch Controle Davizz
            
            Emulador de PS2 (baseado no ARMSX2) com controle de toque no estilo dos jogos de futebol mobile, feito para o Bomba Patch.
            
            **O que tem de diferente:**
            * Abre direto no jogo depois da primeira configuração
            * Botões grandes com nome: CHUTE, PASSE, ENFIADA, CRUZAR, CORRER e TROCAR
            * Segurar o X também faz o jogador correr (pressão na defesa)
            * Tamanho dos controles ajustável no menu do jogo
            
            **Como instalar:** baixe o arquivo BombaPath_Controle_Davizz.apk logo abaixo, em Assets, e abra no celular. Se o Android pedir, permita instalar apps desconhecidos.
            
            **Importante:** o app não vem com o jogo. Na primeira vez ele pede a BIOS do PS2 e a ISO do Bomba Patch, que você precisa ter.
            
            Versão ${{ needs.build.outputs.version_name }}, compilação ${{ github.sha }}
          draft: false
          prerelease: false
          files: artifact/*.apk
